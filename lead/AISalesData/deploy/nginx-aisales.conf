# nginx reverse proxy for AI Sales Machine — IP-only, self-signed TLS.
#
#   sudo cp deploy/nginx-aisales.conf /etc/nginx/sites-available/aisales
#   sudo ln -sf /etc/nginx/sites-available/aisales /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# WHY TLS EVEN WITHOUT A DOMAIN
#   The login password and every SMTP password typed into the UI cross the
#   network. Over plain HTTP they are readable in transit, which would make
#   the login gate pointless. A self-signed cert produces one browser warning
#   you accept once; the connection is encrypted either way. Swap in
#   Let's Encrypt the moment a domain points here.

upstream aisales_app {
    server 127.0.0.1:8501;
}

# Plain HTTP exists only to push you to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/aisales/selfsigned.crt;
    ssl_certificate_key /etc/ssl/aisales/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Uploaded contact lists can be large.
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://aisales_app;
        proxy_http_version 1.1;

        # Streamlit is websocket-driven; without these the UI never connects.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A scrape or a long send can hold the connection open for minutes.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
